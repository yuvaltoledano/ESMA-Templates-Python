# Three containers on one host; see docs/deploy.md for the runbook.
#
#   app     the Python API (FastAPI + uvicorn). No published ports: only
#           `web` can reach it, over the Compose network. Requests are
#           light: the page queues every pool as a background job; only
#           direct calls to POST /api/process (pools up to ~30,000 loans)
#           run inside the request.
#   worker  the background-job runner (esma-milan-worker), the same image
#           as `app`. Drains the `jobs` volume one job at a time.
#   web     Caddy. Terminates HTTPS, asks for the password, serves the
#           built frontend and proxies /api/* to app:8000.
#
# Every per-deployment value (hostname, user, password hash, worker count,
# rate limits, job retention) comes from a .env file next to this file.
# Nothing in the repository names a host or a secret.

services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      ESMA_MILAN_HOST: 0.0.0.0
      ESMA_MILAN_PORT: "8000"
      # Rate limits are keyed on the client address Caddy forwards in
      # X-Forwarded-For. Trusting that header is safe here because the
      # app has no published port, so only Caddy can reach it. Never set
      # this when the app port is exposed directly.
      ESMA_MILAN_TRUST_PROXY: "1"
      # Background jobs: the shared directory and the per-file upload cap
      # for POST /api/jobs (a 300,000-loan loans CSV is about 175 MB).
      ESMA_MILAN_JOBS_DIR: /jobs
      ESMA_MILAN_MAX_UPLOAD_MB: "600"
    volumes:
      - jobs:/jobs
    # Liveness comes from the image's HEALTHCHECK (Dockerfile); `web`
    # waits for it below.

  worker:
    build:
      context: .
      target: app
    command: ["/app/.venv/bin/esma-milan-worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      ESMA_MILAN_JOBS_DIR: /jobs
    volumes:
      - jobs:/jobs
    # On `docker compose stop` / `up -d --build` the worker gets this long
    # to finish the job in flight before it is killed. A job that is
    # killed anyway is marked failed/interrupted when the worker restarts
    # and must be resubmitted (see docs/deploy.md).
    stop_grace_period: 30s
    healthcheck:
      disable: true

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"     # HTTP: redirected to HTTPS, and used for certificate issuance
      - "443:443"   # HTTPS (TCP only; HTTP/3 over UDP is not published)
    volumes:
      - caddy_data:/data       # certificates and account keys: must survive restarts
      - caddy_config:/config   # Caddy's last-loaded configuration
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  jobs:   # background-job inputs, status and outputs (see docs/deploy.md section 11)
