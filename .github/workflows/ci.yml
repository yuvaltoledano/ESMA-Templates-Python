name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # tests/unit/test_bundled_taxonomy.py checks the bundled taxonomy
          # against the R reference's copy and skips when the submodule is
          # absent; checking it out here makes CI enforce the lockstep.
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project (with dev extras, locked)
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests scripts

      - name: Type-check (mypy)
        run: uv run mypy

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Integration tests
        run: uv run pytest tests/integration -v

      - name: Parity tests (Layer 1, synthetic + real)
        run: uv run pytest tests/parity -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build --target app -t esma-milan-app .

      - name: Build web image
        run: docker build --target web -t esma-milan-web .
